<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="GitHub stats: 19 repos, 10 stars, 1 follower, 1 fork">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
      .num   { font-family: 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; font-weight: 700; }
      .label { font-family: 'Space Grotesk', system-ui, 'Segoe UI', sans-serif; font-weight: 500; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    ]]></style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="459" height="199" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="459" height="5" rx="2.5" fill="url(#accent)"/>

  <text class="mono" x="28" y="42" font-size="13" fill="#a78bfa">GITHUB STATS</text>
  <text class="num" x="28" y="88" font-size="30" fill="#ffffff">19</text>
  <text class="label" x="28" y="108" font-size="13" fill="#8b949e">Public Repos</text>
  <text class="mono" x="28" y="124" font-size="11" fill="#6e7681">5 own · 14 forks</text>

  <text class="num" x="248" y="88" font-size="30" fill="#ffffff">10</text>
  <text class="label" x="248" y="108" font-size="13" fill="#8b949e">Stars Earned</text>
  <text class="mono" x="248" y="124" font-size="11" fill="#6e7681">across all repos</text>

  <text class="num" x="28" y="150" font-size="30" fill="#ffffff">1</text>
  <text class="label" x="28" y="170" font-size="13" fill="#8b949e">Follower · Following 4</text>

  <text class="num" x="248" y="150" font-size="30" fill="#ffffff">1</text>
  <text class="label" x="248" y="170" font-size="13" fill="#8b949e">Fork Received</text>

  <rect x="28" y="182" width="404" height="1" fill="#21262d"/>
  <text class="mono" x="28" y="196" font-size="11" fill="#6e7681">member since 2022 · NPU Xi'an</text>
</svg>
