<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Muyuan Zhang — Computational Imaging Researcher and AI Agent Tinkerer">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap');
      .title { font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 700; }
      .sub   { font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 500; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="0.55" stop-color="#12142e"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <circle cx="150" cy="280" r="190" fill="url(#glowBlue)" filter="url(#blur)"/>
  <circle cx="1010" cy="50" r="210" fill="url(#glowPurple)" filter="url(#blur)"/>

  <!-- neural doodle -->
  <g stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M 80 60 L 130 95 L 210 70 L 280 110"/>
  </g>
  <g fill="#a78bfa" fill-opacity="0.85">
    <circle cx="80" cy="60" r="3"/>
    <circle cx="130" cy="95" r="3"/>
    <circle cx="210" cy="70" r="3"/>
    <circle cx="280" cy="110" r="3"/>
  </g>

  <!-- title block -->
  <text class="title" x="70" y="122" font-size="58" fill="url(#titleGrad)" letter-spacing="1">MUYUAN ZHANG</text>
  <text class="sub" x="72" y="160" font-size="19" fill="#a3b3d6">Computational Imaging Researcher · AI Agent Tinkerer</text>
  <text class="mono" x="72" y="188" font-size="13" fill="#7c3aed">DU · arXiv:2606.24153 · NPU Xi'an</text>

  <!-- chips -->
  <g font-family="'Space Grotesk', system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="500">
    <rect x="70" y="212" rx="13" width="120" height="26" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-opacity="0.6"/>
    <text x="130" y="229" text-anchor="middle" fill="#c4b5fd">Video SCI</text>
    <rect x="204" y="212" rx="13" width="152" height="26" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="280" y="229" text-anchor="middle" fill="#93c5fd">Deep Unfolding</text>
    <rect x="370" y="212" rx="13" width="130" height="26" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="435" y="229" text-anchor="middle" fill="#6ee7b7">PyTorch</text>
    <rect x="514" y="212" rx="13" width="110" height="26" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="569" y="229" text-anchor="middle" fill="#fcd34d">AI Agents</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="640" y="60" width="490" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <path d="M 640 70 Q 640 60 650 60 H 1120 Q 1130 60 1130 70 V 92 H 640 Z" fill="#161b22"/>
    <circle cx="664" cy="76" r="6" fill="#ff5f57"/>
    <circle cx="682" cy="76" r="6" fill="#febc2e"/>
    <circle cx="700" cy="76" r="6" fill="#28c840"/>
    <text class="mono" x="780" y="81" font-size="12.5" fill="#8b949e" text-anchor="middle">du — research-agent — zsh</text>

    <text class="mono" x="668" y="118" font-size="13.5" fill="#8b949e">➜  ~ <tspan fill="#3fb950">python</tspan> <tspan fill="#ffa657">demo.py</tspan> <tspan fill="#79c0ff">--video simulation</tspan></text>
    <text class="mono" x="668" y="142" font-size="13.5" fill="#8b949e">▸ coded aperture <tspan fill="#7ee787">[███████░░░]</tspan> 1 snapshot</text>
    <text class="mono" x="668" y="166" font-size="13.5" fill="#8b949e">▸ differential unfolding <tspan fill="#7ee787">[██████████]</tspan> 10 frames</text>
    <text class="mono" x="668" y="190" font-size="13.5" fill="#8b949e">✓ done in <tspan fill="#79c0ff">0.42s</tspan> · PSNR <tspan fill="#ffa657">31.4 dB</tspan> · SSIM <tspan fill="#ffa657">0.91</tspan></text>
    <text class="mono" x="668" y="222" font-size="13.5" fill="#8b949e">➜  ~ <tspan fill="#3fb950">du</tspan> <tspan fill="#79c0ff">--agent</tspan> <tspan fill="#ffa657">"draft related work"</tspan></text>
    <text class="mono" x="668" y="246" font-size="13.5" fill="#7ee787">✓ outline ready · writing in background …</text>
  </g>

  <!-- bottom accent -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#titleGrad)" opacity="0.85"/>
</svg>
